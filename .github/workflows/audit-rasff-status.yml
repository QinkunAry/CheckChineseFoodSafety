name: Audit published EU RASFF records

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 2"

permissions:
  contents: read
  issues: write

concurrency:
  group: audit-published-eu-rasff-records
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project
        run: python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Audit every published RASFF detail
        run: >-
          python -m food_safety_watch audit-rasff-status
          --input data/processed/rasff_cn.jsonl
          --report reports/rasff_status_audit.json
          --max-records 100

      - name: Publish audit summary
        if: always()
        shell: bash
        run: |
          echo '## Published EU RASFF status audit' >> "$GITHUB_STEP_SUMMARY"
          if [[ -f reports/rasff_status_audit.json ]]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat reports/rasff_status_audit.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'RASFF status audit report was not generated.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eu-rasff-published-status-audit
          path: reports/rasff_status_audit.json
          if-no-files-found: warn
          retention-days: 30

      - name: Open or update failure issue
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const title = "[automation] Published EU RASFF status audit failed";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "The published EU RASFF detail-status audit failed or found a changed record.",
              "",
              `- Workflow run: ${runUrl}`,
              `- Branch: ${context.ref}`,
              `- Commit: ${context.sha}`,
              `- Trigger: ${context.eventName}`,
              "",
              "The committed release was not modified. Review the audit artifact before rebuilding or withdrawing records."
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const existing = issues.find(issue => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

      - name: Close resolved failure issue
        if: success()
        uses: actions/github-script@v8
        with:
          script: |
            const title = "[automation] Published EU RASFF status audit failed";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const existing = issues.find(issue => issue.title === title && !issue.pull_request);
            if (existing) {
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Published EU RASFF status audit recovered successfully: ${runUrl}`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: "closed",
                state_reason: "completed"
              });
            }
