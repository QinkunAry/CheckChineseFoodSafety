name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project
        run: python -m pip install -e .

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Validate committed data
        run: >-
          python -m food_safety_watch validate
          --input data/processed/fda_cn.jsonl
          --report reports/fda_quality.json
          --min-records 1000

      - name: Validate committed Japan MHLW data
        run: >-
          python -m food_safety_watch validate
          --input data/processed/japan_mhlw_cn.jsonl
          --schema schemas/record.schema.json
          --report reports/japan_mhlw_quality.json
          --source-id jp_caa_recalls
          --min-records 1
