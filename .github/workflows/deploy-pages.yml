name: Deploy static data site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-pages.yml"
      - "data/processed/**"
      - "data/sources.json"
      - "src/food_safety_watch/**"
      - "schemas/record.schema.json"
      - "pyproject.toml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-static-data-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project
        run: python -m pip install -e .

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build static data browser
        run: python -m food_safety_watch build-site --output-dir site

      - name: Verify static data browser output
        shell: bash
        run: |
          test -s site/index.html
          test -s site/data/records.json
          test -s site/data/summary.json
          python -c "import json,pathlib; summary=json.loads(pathlib.Path('site/data/summary.json').read_text(encoding='utf-8')); records=json.loads(pathlib.Path('site/data/records.json').read_text(encoding='utf-8')); assert summary['record_count']==len(records); assert summary['record_count']>=3000; assert not summary['missing_files']; print(f\"Verified static site with {summary['record_count']} records\")"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
