name: Probe China SAMR sampling source

on:
  workflow_dispatch:
  schedule:
    - cron: "33 7 * * 2"

permissions:
  contents: read

concurrency:
  group: probe-china-samr-sampling-source
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project
        run: python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Probe official SAMR notices and workbooks
        run: >-
          python -m food_safety_watch probe-china-samr
          --max-notices 1
          --max-attachments 2
          --min-listing-count 100
          --min-discovered-notices 2
          --min-workbooks 1
          --report reports/china_samr_probe.json

      - name: Publish diagnostic summary
        if: always()
        shell: bash
        run: |
          echo '## China SAMR sampling probe' >> "$GITHUB_STEP_SUMMARY"
          if [[ -f reports/china_samr_probe.json ]]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat reports/china_samr_probe.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'China SAMR probe report was not generated.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: china-samr-probe-report
          path: reports/china_samr_probe.json
          if-no-files-found: warn
          retention-days: 30
