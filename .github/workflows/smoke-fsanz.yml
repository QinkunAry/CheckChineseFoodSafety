name: Smoke test FSANZ source

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 2"

permissions:
  contents: read

concurrency:
  group: smoke-fsanz-source
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project
        run: python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke test official FSANZ pages
        run: >-
          python -m food_safety_watch smoke-fsanz
          --report reports/fsanz_smoke.json
          --schema schemas/record.schema.json
          --min-sitemap-recalls 100
          --min-china-records 0
          --url https://www.foodstandards.gov.au/food-recalls/recall-alert/auxico-perth-pty-ltd-baixiang-bowl-noodle-pork-bone-flavour-112g-and
          --url https://www.foodstandards.gov.au/food-recalls/recall-alert/yuyu-pty-ltd-bestore-pork-jerky-sesame-flavour-100g
          --url https://www.foodstandards.gov.au/food-recalls/recall-alert/run-feng-trading-melbourne-pty-ltd-biscuits-milk-flavour-150g
          --url https://www.foodstandards.gov.au/food-recalls/recall-alert/silver-pacific-pty-ltd-laohenghe-dressing-sauce-220g
          --url https://www.foodstandards.gov.au/food-recalls/recall-alert/updated-17092025-kaisi-australia-gong-sugar-crisp-sesame-flavour-100g
          --url https://www.foodstandards.gov.au/food-recalls/recall-alert/woolworths-seafood-salad-250g

      - name: Compare recall URL inventory
        run: >-
          python -m food_safety_watch inventory-fsanz
          --state data/state/fsanz_recall_urls.json
          --report reports/fsanz_inventory.json

      - name: Publish diagnostic summary
        if: always() && hashFiles('reports/fsanz_smoke.json') != ''
        shell: bash
        run: |
          echo '## FSANZ smoke diagnostic' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat reports/fsanz_smoke.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '## FSANZ URL inventory' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat reports/fsanz_inventory.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fsanz-smoke-report
          path: |
            reports/fsanz_smoke.json
            reports/fsanz_inventory.json
          if-no-files-found: warn
          retention-days: 30
