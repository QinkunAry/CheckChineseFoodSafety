name: Smoke test FSANZ source

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 2"

permissions:
  contents: read

concurrency:
  group: smoke-fsanz-source
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project
        run: python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke test official FSANZ pages
        run: >-
          python -m food_safety_watch smoke-fsanz
          --report reports/fsanz_smoke.json
          --schema schemas/record.schema.json
          --min-sitemap-recalls 100
          --url https://www.foodstandards.gov.au/food-recalls/recall-alert/galaxy-import-and-export-pty-ltd-yunnan-rice-vermicelli
          --url https://www.foodstandards.gov.au/food-recalls/recall-alert/besta-pty-ltd-premium-chinese-sausagecanton-300g
          --url https://www.foodstandards.gov.au/food-recalls/recall-alert/woolworths-seafood-salad-250g

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fsanz-smoke-report
          path: reports/fsanz_smoke.json
          if-no-files-found: warn
          retention-days: 30
